name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Optional release signing. Add these repository secrets to produce signed release builds:
      # GODRAW_KEYSTORE_BASE64, GODRAW_KEYSTORE_PASSWORD, GODRAW_KEY_ALIAS, GODRAW_KEY_PASSWORD
      KEYSTORE_B64: ${{ secrets.GODRAW_KEYSTORE_BASE64 }}
      GODRAW_KEYSTORE_PASSWORD: ${{ secrets.GODRAW_KEYSTORE_PASSWORD }}
      GODRAW_KEY_ALIAS: ${{ secrets.GODRAW_KEY_ALIAS }}
      GODRAW_KEY_PASSWORD: ${{ secrets.GODRAW_KEY_PASSWORD }}
      GODRAW_VERIFICATION_URL: ${{ secrets.GODRAW_VERIFICATION_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core engine tests
        run: ./gradlew :core:test --stacktrace

      - name: App unit tests (Robolectric)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare release signing
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/godraw-release.jks"
          echo "GODRAW_KEYSTORE_FILE=$RUNNER_TEMP/godraw-release.jks" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/GoDraw-debug.apk dist/GoDraw-debug.apk
          if [ -f app/build/outputs/apk/release/GoDraw-release.apk ]; then
            cp app/build/outputs/apk/release/GoDraw-release.apk dist/GoDraw-release.apk
          else
            cp app/build/outputs/apk/release/GoDraw-release-unsigned.apk dist/GoDraw-release-unsigned.apk
          fi
          cp app/build/outputs/bundle/release/GoDraw-release.aab dist/GoDraw-release.aab
          ls -la dist
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::No signing secrets configured: release APK/AAB are unsigned and must be signed before distribution."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GoDraw-builds
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
