name: Prefly web

on:
  push:
    paths: ["prefly/**", ".github/workflows/prefly.yml"]
  pull_request:
    paths: ["prefly/**", ".github/workflows/prefly.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prefly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prefly/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
